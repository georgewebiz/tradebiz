<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directory Index</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --folder: #79c0ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
    }
    h1 { margin-top: 0; font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; color: #f0f6fc; }
    .status { color: var(--text-muted); font-size: 0.9rem; margin-top: 1rem; }
    .error { color: #f85149; background: rgba(248, 81, 73, 0.1); border: 1px solid #f85149; padding: 1rem; border-radius: 6px; margin-top: 1rem; }
    ul { list-style-type: none; padding-left: 1.2rem; margin: 0; }
    .root-list { padding-left: 0; }
    li { margin: 0.3rem 0; line-height: 1.4; }
    .item-link { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem; }
    .item-link:hover { color: var(--accent); text-decoration: underline; }
    .folder-name { color: var(--folder); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">📂 Directory Listing</h1>
    <div id="status" class="status">Loading directory contents...</div>
    <div id="file-tree"></div>
  </div>

  <script>
    // ⚙️ CHANGE THESE IF AUTO-DETECTION FAILS OR YOUR BRANCH IS MASTER
    const CONFIG = {
      branch: 'main', // Try changing to 'master' if your default branch is master
      forcedOwner: '', // e.g. 'your-username' (leave blank to auto-detect)
      forcedRepo: ''   // e.g. 'your-repo-name' (leave blank to auto-detect)
    };

    async function init() {
      const statusEl = document.getElementById('status');
      const treeContainer = document.getElementById('file-tree');

      let owner = CONFIG.forcedOwner;
      let repo = CONFIG.forcedRepo;

      if (!owner || !repo) {
        const host = window.location.hostname;
        const pathSegments = window.location.pathname.split('/').filter(Boolean);

        if (host.endsWith('.github.io')) {
          owner = host.split('.')[0];
          repo = pathSegments[0] || '';
        }
      }

      if (!owner || !repo) {
        statusEl.className = 'error';
        statusEl.innerHTML = `<strong>Configuration Error:</strong> Could not auto-detect GitHub owner and repo from URL.<br>Please open script settings in <code>index.html</code> and manually set <code>forcedOwner</code> and <code>forcedRepo</code>.`;
        return;
      }

      document.getElementById('title').textContent = `📂 ${owner}/${repo}`;

      try {
        const url = `https://api.github.com/repos/${owner}/${repo}/git/trees/${CONFIG.branch}?recursive=1`;
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error(`API Request Failed: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        
        if (!data.tree) {
          throw new Error("Invalid response format received from GitHub API.");
        }

        const files = data.tree.filter(item => item.path !== 'index.html' && !item.path.startsWith('.'));
        statusEl.style.display = 'none';
        
        const treeRoot = buildTreeObject(files);
        treeContainer.appendChild(renderTree(treeRoot));

      } catch (err) {
        statusEl.className = 'error';
        statusEl.innerHTML = `<strong>Failed to load folder structure:</strong> ${err.message}<br><br>` +
                             `Possible causes:<br>` +
                             `1. Your default branch is named <code>master</code> instead of <code>main</code> (Update CONFIG.branch).<br>` +
                             `2. The repository is <strong>private</strong> (GitHub API requires public access for unauthenticated calls).<br>` +
                             `3. You hit GitHub's unauthenticated rate limit (60 requests/hour).`;
      }
    }

    function buildTreeObject(items) {
      const root = {};
      items.forEach(item => {
        const parts = item.path.split('/');
        let current = root;
        parts.forEach((part, index) => {
          if (!current[part]) {
            current[part] = {
              __isLeaf: index === parts.length - 1 && item.type === 'blob',
              __path: item.path
            };
          }
          current = current[part];
        });
      });
      return root;
    }

    function renderTree(node, isRoot = true) {
      const ul = document.createElement('ul');
      if (isRoot) ul.className = 'root-list';

      const keys = Object.keys(node).filter(k => !k.startsWith('__')).sort((a, b) => {
        const aIsLeaf = node[a].__isLeaf;
        const bIsLeaf = node[b].__isLeaf;
        if (aIsLeaf === bIsLeaf) return a.localeCompare(b);
        return aIsLeaf ? 1 : -1;
      });

      keys.forEach(key => {
        const item = node[key];
        const li = document.createElement('li');

        if (item.__isLeaf) {
          const a = document.createElement('a');
          a.href = item.__path;
          a.className = 'item-link';
          a.innerHTML = `📄 ${key}`;
          li.appendChild(a);
        } else {
          const details = document.createElement('details');
          details.open = true;
          const summary = document.createElement('summary');
          summary.className = 'folder-name';
          summary.innerHTML = `📁 ${key}`;
          details.appendChild(summary);
          details.appendChild(renderTree(item, false));
          li.appendChild(details);
        }
        ul.appendChild(li);
      });
      return ul;
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
